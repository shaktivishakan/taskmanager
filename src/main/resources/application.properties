# ---------- Database connection (PostgreSQL) ----------
# Format: jdbc:postgresql://<host>:<port>/<database-name>
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.username=postgres
# Password comes from an environment variable, NOT written here,
# because this file is pushed to GitHub.
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# update = create tables if missing, add new columns, never delete data
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs (handy while learning)
spring.jpa.show-sql=true